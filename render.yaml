services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: senamarket-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: senamarket-db
          property: connectionString
      - key: REDIS_ENABLED
        value: false
      - key: CORS_ORIGINS
        value: https://senamarket-web.onrender.com,http://localhost:5173

  # 2. Frontend Static Site (React 18 + Vite)
  - type: static
    name: senamarket-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL pública del backend (ej: https://senamarket-api-xxxx.onrender.com).
      # Se define a mano en el Dashboard: Render no expone la URL pública vía fromService.
      - key: VITE_API_URL
        sync: false

# 3. Base de Datos en la Nube (PostgreSQL Gratuita de Render)
databases:
  - name: senamarket-db
    databaseName: senamarket
    user: senamarket
    plan: free
