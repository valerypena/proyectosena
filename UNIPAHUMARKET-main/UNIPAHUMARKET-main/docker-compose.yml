version: '3.8'

services:
  # --- Infrastructure Services ---
  mysql:
    image: mysql:8.0
    container_name: unimarket-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: unimarket
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - unimarket-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: unimarket-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - unimarket-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unimarket-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - unimarket-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: unimarket-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - unimarket-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Microservices (Node.js + TypeScript) ---
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: unimarket-api-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - PRODUCT_SERVICE_URL=http://product-service:3003
      - ORDER_SERVICE_URL=http://order-service:3004
      - CART_SERVICE_URL=http://cart-service:3005
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - HEALTH_SERVICE_URL=http://health-service:3007
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - unimarket-net

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: unimarket-auth-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=unimarket
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - JWT_SECRET=unimarket_super_secret_jwt_key_2026
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: unimarket-user-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=unimarket
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: unimarket-product-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=unimarket
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: unimarket-order-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=unimarket
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: unimarket-cart-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unimarket-net

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: unimarket-notification-service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  sync-service:
    build:
      context: ./services/sync-service
      dockerfile: Dockerfile
    container_name: unimarket-sync-service
    restart: always
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=unimarket
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - unimarket-net

  health-service:
    build:
      context: ./services/health-service
      dockerfile: Dockerfile
    container_name: unimarket-health-service
    restart: always
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MONGO_URI=mongodb://mongodb:27017/unimarket_nosql
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - mysql
      - mongodb
      - redis
      - rabbitmq
    networks:
      - unimarket-net

networks:
  unimarket-net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
