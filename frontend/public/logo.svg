<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Isotipo: Fusión de la silueta icónica SENA con Bolsa de Compras -->
  <g transform="translate(6, 6)">
    <!-- Fondo distintivo circular/redondeado en Blanco Puro -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#FFFFFF" />
    
    <!-- Silueta Icónica SENA en Verde Institucional -->
    <circle cx="24" cy="13" r="4.5" fill="#39A900" />
    
    <!-- Brazos/Flecha dinámicos del SENA -->
    <path d="M12 25 C14 21, 20 20, 24 23 C28 20, 34 21, 36 25" stroke="#39A900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Base de bolsa de compras en Azul SENA -->
    <path d="M16 28 L20 38 C20.5 39.5, 22 40.5, 24 40.5 C26 40.5, 27.5 39.5, 28 38 L32 28" stroke="#00324D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 32 L27 32" stroke="#39A900" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tipografía: sena market -->
  <g transform="translate(64, 38)">
    <!-- SENA en Blanco Puro Impecable -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="29" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">
      sena
    </text>
    
    <!-- MARKET en Amarillo Dorado Brillante para contraste y calidez -->
    <text x="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="29" font-weight="800" fill="#FFE600" letter-spacing="-0.5">
      market
    </text>

    <!-- Subtítulo de emprendimiento -->
    <text x="2" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#F0FDF4" letter-spacing="1.2" opacity="0.95">
      EMPRENDIMIENTO &amp; COMERCIO
    </text>
  </g>
</svg>
