<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Isotipo: Fusión de la silueta icónica SENA con Bolsa/Carrito de Compras -->
  <g transform="translate(6, 6)">
    <!-- Fondo distintivo redondeado -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#00324D" />
    
    <!-- Silueta Icónica SENA (Cabeza y cuerpo dinámico) -->
    <!-- Cabeza -->
    <circle cx="24" cy="13" r="4.5" fill="#39A900" />
    
    <!-- Cuerpo / Brazos dinámicos en flecha / bolsa de mercado -->
    <path d="M12 25 C14 21, 20 20, 24 23 C28 20, 34 21, 36 25" stroke="#39A900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Líneas inferiores de avance / base de bolsa de mercado -->
    <path d="M16 28 L20 38 C20.5 39.5, 22 40.5, 24 40.5 C26 40.5, 27.5 39.5, 28 38 L32 28" stroke="#FFE600" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 32 L27 32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Tipografía: sena market -->
  <g transform="translate(64, 38)">
    <!-- SENA en Azul Marino profundo -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="28" font-weight="900" fill="#00324D" letter-spacing="-0.8">
      sena
    </text>
    
    <!-- MARKET en Verde Institucional SENA -->
    <text x="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="28" font-weight="700" fill="#39A900" letter-spacing="-0.5">
      market
    </text>

    <!-- Tagline sutil inferior -->
    <text x="2" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#00324D" letter-spacing="1.2" opacity="0.8">
      EMPRENDIMIENTO &amp; COMERCIO
    </text>
  </g>
</svg>
